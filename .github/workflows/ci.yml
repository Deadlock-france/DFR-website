name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée rend le run précédent inutile sur la même référence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Informatif : le projet ne bloque pas sur le style.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests unitaires
        run: npm run test:run

      # Sans DEEPL_API_KEY, les articles non traduits par Valve restent en
      # anglais : le build aboutit sans qu'aucun secret soit nécessaire.
      - name: Build de production
        run: npm run build
